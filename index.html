<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>GyaanIQ AI</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/accessibility.js"></script>
</head>

<body>


    <div class="main">
        <div class="topbar">
            <div class="toggle">

                <div class="profile-popup-wrapper">
                    <div class="user" id="user-chip" role="button" aria-haspopup="true" aria-expanded="false"
                        tabindex="0" title="View profile">
                        <img class="avatar" id="avatar-el" src="logo.png" alt="GyaanIQ logo">
                        <div>
                            <img class="title-logo" id="title-logo" src="title.png" alt="GyaanIQ AI">
                        </div>
                    </div>

                    <!-- Profile Popup -->
                    <div class="profile-popup hidden" id="profile-popup" role="dialog" aria-label="Profile">
                        <!-- Logged-in view -->
                        <div class="profile-popup-loggedin auth-logged-in-only">
                            <div class="profile-popup-avatar" id="popup-avatar-initials"></div>
                            <div class="profile-popup-info">
                                <span class="profile-popup-name" id="popup-name"></span>
                                <span class="profile-popup-email" id="popup-email"></span>
                            </div>
                            <div class="profile-popup-divider"></div>
                            <button type="button" class="profile-popup-action" id="popup-logout-btn">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                    <polyline points="16 17 21 12 16 7" />
                                    <line x1="21" y1="12" x2="9" y2="12" />
                                </svg>
                                Log out
                            </button>
                        </div>
                        <!-- Logged-out view -->
                        <div class="profile-popup-loggedout auth-logged-out-only">
                            <svg class="profile-popup-guest-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.5">
                                <circle cx="12" cy="8" r="4" />
                                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
                            </svg>
                            <p class="profile-popup-guest-text">You're not logged in</p>
                            <p class="profile-popup-guest-sub">Sign in to access your profile and history</p>
                            <button type="button" class="profile-popup-login-btn" id="popup-login-btn">Log in</button>
                            <button type="button" class="profile-popup-signup-btn" id="popup-signup-btn">Create
                                account</button>
                        </div>
                    </div>
                </div>
                <div class="nav-item active">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M12 4v16m8-8H4" />
                    </svg>
                    New chat
                </div>
                <a href="index.html" class="active" data-tab="chat">Chat</a>
                <a class="auth-logged-in-only" href="progress.html" data-tab="Progress">Progress</a>
                <a class="auth-logged-in-only" href="previous-pdf.html" data-tab="Previous_Pdf">My Materials</a>
                <a class="auth-logged-in-only" href="history.html" data-tab="History">History</a>
                <a class="auth-logged-in-only" href="competency.html" data-tab="Competency">Competency</a>
                <a href="https://igotkarmayogi.gov.in/#/" target="_blank" rel="noopener" class="nav-item"
                    data-tab="iGOT Karmayogi">iGOT Karmayogi</a>

            </div>
            <div class="topbar-right">
                <button type="button" class="auth-btn login-btn auth-logged-out-only" id="login-btn">Log in</button>
                <button type="button" class="auth-btn signup-btn auth-logged-out-only" id="signup-btn">Sign up</button>

                <div class="dropdown-wrap">
                    <button type="button" class="top-icon-link" aria-label="Options menu" aria-haspopup="true"
                        aria-expanded="false" id="list-btn" title="Options & Course Progress">
                        <svg class="icon three-dots-icon" viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="5" r="2" />
                            <circle cx="12" cy="12" r="2" />
                            <circle cx="12" cy="19" r="2" />
                        </svg>
                    </button>
                    <div class="dropdown-menu" id="list-menu" role="menu">
                        <!-- Success / Progress Bar Section -->
                        <div class="menu-progress-card auth-logged-in-only">
                            <div class="menu-progress-header">
                                <div class="progress-title-wrap">
                                    <svg class="progress-icon" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd"
                                            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                                            clip-rule="evenodd" />
                                    </svg>
                                    <span class="progress-title">Course Progress</span>
                                </div>
                                <span class="progress-percent" id="course-progress-val">78%</span>
                            </div>
                            <div class="progress-bar-wrapper">
                                <div class="progress-bar-track" role="progressbar" aria-valuenow="78" aria-valuemin="0"
                                    aria-valuemax="100" aria-label="Course completion progress">
                                    <div class="progress-bar-fill" style="width: 78%;">
                                        <div class="progress-shimmer"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="progress-meta">
                                <span class="progress-modules">14 of 18 Modules</span>
                                <span class="progress-tag">On Track 🎯</span>
                            </div>
                        </div>

                        <div class="dropdown-items-group">
                            <a href="profile.html" class="dropdown-item auth-logged-in-only" id="menu-profile-item"
                                role="menuitem">
                                <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                    <circle cx="12" cy="7" r="4" />
                                </svg>
                                <span>Profile</span>
                            </a>
                            <div class="dropdown-item auth-logged-in-only" id="menu-pinned-btn" role="menuitem">
                                <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8">
                                    <line x1="12" y1="17" x2="12" y2="22" />
                                    <path
                                        d="M5 17h14l-1.5-3.5V5a1.5 1.5 0 0 0-1.5-1.5h-8A1.5 1.5 0 0 0 6.5 5v8.5L5 17z" />
                                </svg>
                                <span>Pinned</span>
                            </div>
                            <div class="dropdown-item auth-logged-in-only" id="menu-history-btn" role="menuitem">
                                <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8">
                                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                                    <path d="M3 3v5h5" />
                                    <polyline points="12 7 12 12 15 15" />
                                </svg>
                                <span>History</span>
                            </div>
                            <a href="leaderboard.html" class="dropdown-item auth-logged-in-only"
                                id="menu-leaderboard-item" role="menuitem">
                                <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8">
                                    <path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z" />
                                    <path
                                        d="M7 5H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4M17 5h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4" />
                                </svg>
                                <span>Leaderboard</span>
                            </a>
                            <a href="settings.html" class="dropdown-item" role="menuitem">
                                <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8">
                                    <circle cx="12" cy="12" r="3" />
                                    <path
                                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                                </svg>
                                <span>Settings</span>
                            </a>
                            <div class="menu-divider auth-logged-in-only"></div>
                            <div class="dropdown-item logout auth-logged-in-only" id="menu-logout-btn" role="menuitem">
                                <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                    <polyline points="16 17 21 12 16 7" />
                                    <line x1="21" y1="12" x2="9" y2="12" />
                                </svg>
                                <span>Log out</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="center">
            <img class="hero-title-img" src="title.png" alt="GyaanIQ AI">
            <h1 class="agenda">
                <bold>Learn Smarter. Build Stronger Compentencies.</bold>
            </h1>
            <div class="composer-container">
                <div class="composer">
                    <input type="file" id="pdf-upload-input" accept=".pdf,application/pdf" style="display: none;">
                    <input type="file" id="image-upload-input" accept="image/*" style="display: none;">
                    <input type="file" id="word-upload-input"
                        accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                        style="display: none;">

                    <div class="plus-menu-wrapper">
                        <button type="button" class="circle-btn plus-btn" id="attach-pdf-btn" title="Attach"
                            aria-label="Attach file" aria-haspopup="true" aria-expanded="false">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.2" stroke-linecap="round">
                                <line x1="12" y1="5" x2="12" y2="19" />
                                <line x1="5" y1="12" x2="19" y2="12" />
                            </svg>
                        </button>
                        <div class="plus-popup-menu hidden" id="plus-popup-menu" role="menu">
                            <button type="button" class="plus-menu-item" id="upload-pdf-option" role="menuitem">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                    <polyline points="14 2 14 8 20 8" />
                                </svg>
                                Upload PDF
                            </button>
                            <button type="button" class="plus-menu-item" id="upload-image-option" role="menuitem">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                                    <circle cx="8.5" cy="8.5" r="1.5" />
                                    <polyline points="21 15 16 10 5 21" />
                                </svg>
                                Upload Image
                            </button>
                            <button type="button" class="plus-menu-item" id="upload-word-option" role="menuitem">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                    <polyline points="14 2 14 8 20 8" />
                                </svg>
                                Upload Word
                            </button>
                        </div>
                    </div>

                    <input type="text" id="prompt-input" placeholder="Ask GyaanIQ Anything About Your Learning...">

                    <button class="circle-btn mic" id="mic-btn" aria-label="Voice input">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4" />
                        </svg>
                    </button>
                    <button class="circle-btn send" id="send-btn" aria-label="Send message">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M4 20l16-8L4 4v6l10 2-10 2z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- Auth Modal (Login & Signup) -->
    <div class="auth-modal-overlay" id="auth-modal" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="auth-modal-card">
            <button type="button" class="auth-modal-close" id="auth-modal-close"
                aria-label="Close dialog">&times;</button>
            <div class="auth-modal-header">
                <div class="auth-tabs">
                    <button type="button" class="auth-tab-btn active" id="tab-login" data-auth-tab="login">Log
                        in</button>
                    <button type="button" class="auth-tab-btn" id="tab-signup" data-auth-tab="signup">Sign up</button>
                </div>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="form-login">
                <div class="auth-form-group">
                    <label for="login-email">Email or Username</label>
                    <input type="text" id="login-email" class="auth-input" placeholder="name@domain.com" required
                        autocomplete="username">
                </div>
                <div class="auth-form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="auth-input" placeholder="••••••••" required
                        autocomplete="current-password">
                </div>
                <button type="submit" class="auth-submit-btn">Log in to GyaanIQ</button>
            </form>

            <!-- Signup Form -->
            <form class="auth-form hidden" id="form-signup">
                <div class="auth-form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" class="auth-input" placeholder="Enter your full name"
                        autocomplete="name">
                </div>
                <div class="auth-form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" class="auth-input" placeholder="name@domain.com" required
                        autocomplete="email">
                </div>
                <div class="auth-form-group">
                    <label for="signup-password">Create Password</label>
                    <input type="password" id="signup-password" class="auth-input" placeholder="At least 8 characters"
                        required autocomplete="new-password">
                </div>
                <button type="submit" class="auth-submit-btn">Create Account</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Wire up Upload Image / Upload Word options (mirrors the existing Upload PDF pattern).
        // If js/app.js already binds these same IDs, remove this block to avoid double-binding.
        document.getElementById('upload-image-option')?.addEventListener('click', function () {
            document.getElementById('image-upload-input').click();
            document.getElementById('plus-popup-menu')?.classList.add('hidden');
        });
        document.getElementById('upload-word-option')?.addEventListener('click', function () {
            document.getElementById('word-upload-input').click();
            document.getElementById('plus-popup-menu')?.classList.add('hidden');
        });
        document.getElementById('image-upload-input')?.addEventListener('change', function (e) {
            const file = e.target.files && e.target.files[0];
            if (file) {
                console.log('Image selected:', file.name);
                // TODO: hook into your existing upload/preview logic here
            }
        });
        document.getElementById('word-upload-input')?.addEventListener('change', function (e) {
            const file = e.target.files && e.target.files[0];
            if (file) {
                console.log('Word file selected:', file.name);
                // TODO: hook into your existing upload/preview logic here
            }
        });
    </script>
</body>

</html>
